<form onsubmit="envoyerWhatsApp(event)">
<input type="text" id="nom" placeholder="Ton nom complet" required>
<input type="tel" id="tel" placeholder="Ton numéro WhatsApp" required>
<input type="email" id="email" placeholder="Ton email" required>
<button type="submit">S'inscrire sur WhatsApp</button>
</form>
<script>
function envoyerWhatsApp(e){
e.preventDefault();
let nom = document.getElementById('nom').value;
let tel = document.getElementById('tel').value;
let email = document.getElementById('email').value;
let message = "Bonjour CCID MONDE, je veux m'inscrire. Nom : " + nom + ", Telephone : " + tel + ", Email : " + email;
let tonNumero = "13658921339";
window.open("https://wa.me/" + tonNumero + "?text=" + encodeURIComponent(message), "_blank");
}
</script>
